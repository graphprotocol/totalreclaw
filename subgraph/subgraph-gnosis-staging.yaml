# STAGING — Gnosis (isolated DataEdge V2). Deploy via `npm run deploy:staging`.
#
# Audit 1.1: indexes EventfulDataEdgeV2 (`Log(address indexed sender, bytes)`)
# ONLY, from its deploy block — a clean break. There is no legacy data source:
# production is pre-launch and every existing on-chain write is our own test
# data, so nothing is carried over (confirmed: all prod writes came through the
# EntryPoint from the named owner, no cross-owner tampering).
specVersion: 0.0.5
description: TotalReclaw — STAGING subgraph (Gnosis mainnet, isolated DataEdge V2). Sender-authenticated writes; part of the audit-1.1 fix.
repository: https://github.com/graphprotocol/totalreclaw
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EventfulDataEdgeV2
    network: gnosis
    source:
      # TODO(deploy): set to the staging V2 address from
      # `TR_DATAEDGE_V2_TARGET=staging forge script script/DeployDataEdgeV2.s.sol`
      # and its deploy block. Placeholder until the V2 contract is deployed.
      address: "0x0000000000000000000000000000000000000000"
      abi: EventfulDataEdgeV2
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Fact
        - BlindIndex
        - GlobalState
      abis:
        - name: EventfulDataEdgeV2
          file: ./abis/EventfulDataEdgeV2.json
      eventHandlers:
        - event: Log(indexed address,bytes)
          handler: handleLog
      file: ./src/mapping.ts
