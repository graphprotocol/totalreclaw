# Foundry config for the TotalReclaw contracts package (EventfulDataEdge).
#
# Hardhat (`hardhat.config.ts`) is kept only for the localhost dev-loop
# deployer (`scripts/deploy.ts`); live deploys go through `script/*.s.sol`.
#
# `TotalReclawAccount` is a SEPARATE Foundry project under `account/` — see
# its `foundry.toml` for why it must not share this project's remappings
# (they would shift EventfulDataEdge's bytecode and break the staging
# CREATE2 pin in `test/DataEdgeStagingCreate2.t.sol`).
[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
extra_output = ["storageLayout"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
